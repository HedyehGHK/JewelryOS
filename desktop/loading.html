<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
  <title>JewelryOS</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: linear-gradient(160deg, #2b2118, #4a3520); color: #f3e7cf; font-family: Vazirmatn, Tahoma, sans-serif; }
    .box { text-align: center; }
    .logo { font-size: 30px; font-weight: 700; color: #f0c766; margin-bottom: 18px; letter-spacing: .5px; }
    .spin { width: 38px; height: 38px; border: 4px solid rgba(240, 199, 102, .25); border-top-color: #f0c766; border-radius: 50%; margin: 0 auto 16px; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    p { margin: 0; opacity: .8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">◆ JewelryOS</div>
    <div class="spin"></div>
    <p>در حال آماده‌سازی برنامه…</p>
  </div>
</body>
</html>
