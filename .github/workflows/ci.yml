name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore backend/JewelryOS.sln
      - run: dotnet build backend/JewelryOS.sln --no-restore -c Release
      - run: dotnet test backend/JewelryOS.sln --no-build -c Release --logger "console;verbosity=normal"
